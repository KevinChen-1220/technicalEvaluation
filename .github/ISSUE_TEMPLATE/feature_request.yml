name: Feature request
description: Suggest an improvement for SkillScope.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: Thanks for sharing an idea for SkillScope.
  - type: textarea
    id: reproduction
    attributes:
      label: Current behavior or reproduction steps
      description: Describe the current workflow and the steps that reveal the need.
    validations:
      required: true
  - type: textarea
    id: platform
    attributes:
      label: Platform
      description: Specify the operating system and app or web environment.
      placeholder: iOS 18, Android 15, or web
    validations:
      required: true
  - type: input
    id: device-browser
    attributes:
      label: Browser or device
      description: Provide the browser and version, or device model.
      placeholder: Chrome 136 on Windows 11 or iPhone 16
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: Explain the outcome that would make this workflow better.
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Explain what happens today.
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy confirmation
      options:
        - label: I confirm that this request does not contain API keys, tokens, or other secrets.
          required: true
