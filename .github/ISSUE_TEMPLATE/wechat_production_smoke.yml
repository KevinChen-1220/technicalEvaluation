name: WeChat production smoke
description: Capture hosted EdgeOne, real-device, screenshot, and rollback evidence.
title: "[WeChat Smoke]: "
labels:
  - release
  - wechat
  - smoke
body:
  - type: markdown
    attributes:
      value: |
        只有在真实 AppID、production EdgeOne deployment、微信开发者工具登录和真机都可用后才能关闭。真机、EdgeOne、截图、回滚证据必须逐项附上。
        开始前先确认对应的 `wechat_filing` issue 已关闭或已经标明 AppID、备案、隐私和生成式人工智能披露仍为外部阻塞。
  - type: input
    id: version
    attributes:
      label: 小程序版本号
      placeholder: 待配置
    validations:
      required: true
  - type: input
    id: edgeone-deployment
    attributes:
      label: EdgeOne production deployment URL
      placeholder: 待配置
    validations:
      required: true
  - type: input
    id: request-legal-domain
    attributes:
      label: 微信 request合法域名
      placeholder: 待配置
    validations:
      required: true
  - type: textarea
    id: devices
    attributes:
      label: 真机矩阵
      description: 至少记录 iOS 和 Android 设备、微信版本、网络状态。
      placeholder: 待配置
    validations:
      required: true
  - type: textarea
    id: screenshots
    attributes:
      label: 截图证据
      description: 按 docs/wechat/release-evidence/screenshot-naming.md 命名并链接。
      placeholder: 待配置
    validations:
      required: true
  - type: textarea
    id: rollback
    attributes:
      label: 回滚版本和触发条件
      placeholder: 待配置
    validations:
      required: true
  - type: checkboxes
    id: smoke
    attributes:
      label: 外部烟测
      options:
        - label: 隐私 gate、设置页披露、投诉入口和历史记录在真机通过。
          required: true
        - label: 固定 50 题生成在 production EdgeOne 完成，HTML/XML 解析失败、内容安全失败和超时路径可观察。
          required: true
        - label: preview 和 production HTTPS origin 都已加入微信 request合法域名并完成请求验证。
          required: true
        - label: 离线答题、本地缓存、跨设备冲突和结果复盘已验证。
          required: true
        - label: 微信开发者工具预览/上传记录、审核前截图和回滚方案已归档。
          required: true
        - label: 本 issue 不包含上传私钥、模型密钥、OpenID、手机号或后台 token。
          required: true
