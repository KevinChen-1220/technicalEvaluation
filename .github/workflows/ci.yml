name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify GitHub workflow YAML
        run: npm run verify:github-workflows

      - name: Run tests
        run: npm test -- --runInBand

      - name: Check types
        run: npm run typecheck

      - name: Verify native brand assets
        run: npm run verify:assets

      - name: Verify WeChat release contracts
        run: npm run verify:wechat-release -- --check-only

      - name: Build web app
        run: npm run build:web

      - name: Verify web build
        run: npm run verify:web
